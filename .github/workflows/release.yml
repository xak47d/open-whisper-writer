name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-pyinstaller:
    name: Build PyInstaller Binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libportaudio2 \
            libsndfile1 \
            libxcb-xinerama0 \
            libxkbcommon0 \
            libegl1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Build with PyInstaller
        run: ./scripts/build.sh

      - name: Create tarball
        run: |
          cd dist
          tar czf whisper-writer-linux-x86_64.tar.gz whisper-writer/

      - name: Upload PyInstaller artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-writer-linux-x86_64
          path: dist/whisper-writer-linux-x86_64.tar.gz

  build-deb:
    name: Build .deb Package
    runs-on: ubuntu-22.04
    needs: build-pyinstaller
    steps:
      - uses: actions/checkout@v4

      - name: Download PyInstaller build
        uses: actions/download-artifact@v4
        with:
          name: whisper-writer-linux-x86_64
          path: dist/

      - name: Extract tarball
        run: |
          cd dist
          tar xzf whisper-writer-linux-x86_64.tar.gz

      - name: Fix permissions
        run: chmod +x dist/whisper-writer/whisper-writer

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb package
        run: ./scripts/build-deb.sh "${{ steps.version.outputs.version }}"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-writer-deb
          path: dist/*.deb

  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Build Flatpak
        run: |
          flatpak-builder \
            --force-clean \
            --repo=flatpak-repo \
            flatpak-build \
            packaging/flatpak/io.github.xak47d.whisper-writer.yml

      - name: Create Flatpak bundle
        run: |
          flatpak build-bundle \
            flatpak-repo \
            dist/whisper-writer.flatpak \
            io.github.xak47d.whisper-writer

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-writer-flatpak
          path: dist/whisper-writer.flatpak

  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: [build-pyinstaller, build-deb, build-flatpak]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: List artifacts
        run: find release-artifacts/ -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/whisper-writer-linux-x86_64/whisper-writer-linux-x86_64.tar.gz
            release-artifacts/whisper-writer-deb/*.deb
            release-artifacts/whisper-writer-flatpak/whisper-writer.flatpak
          body: |
            ## Installation

            ### Standalone Binary
            Download `whisper-writer-linux-x86_64.tar.gz`, extract, and run:
            ```bash
            tar xzf whisper-writer-linux-x86_64.tar.gz
            ./whisper-writer/whisper-writer
            ```

            ### Debian/Ubuntu (.deb)
            ```bash
            sudo apt install ./whisper-writer_*.deb
            ```

            ### Arch Linux (AUR)
            ```bash
            # Using an AUR helper:
            yay -S whisper-writer
            # Or manually with the PKGBUILD in packaging/arch/
            ```

            ### Flatpak
            ```bash
            flatpak install whisper-writer.flatpak
            ```
