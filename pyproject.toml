[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-writer"
version = "1.1.0"
description = "Speech-to-text desktop application using OpenAI's Whisper — type with your voice"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "savbell" },
    { name = "xak47d" },
]
keywords = ["whisper", "speech-to-text", "voice-typing", "transcription", "faster-whisper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "faster-whisper>=1.2.1",
    "ctranslate2>=4.5.0",
    "openai>=1.58.0",
    "huggingface-hub>=0.27.0",
    "onnxruntime>=1.20.0",
    "numpy>=1.26.0",
    "sounddevice>=0.5.1",
    "soundfile>=0.12.1",
    "PyQt5>=5.15.10",
    "pynput>=1.7.7",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.1",
    "audioplayer>=0.6",
    "webrtcvad-wheels>=2.0.11.post1",
    "tokenizers>=0.21.0",
    "tqdm>=4.67.0",
    "requests>=2.32.0",
    "packaging>=24.0",
    "typing_extensions>=4.12.0",
    "regex>=2024.11.6",
    "Pillow>=11.0.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
cuda = [
    "onnxruntime-gpu>=1.20.0",
]
dev = [
    "pyinstaller>=6.11.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/xak47d/open-whisper-writer"
Repository = "https://github.com/xak47d/open-whisper-writer"
Issues = "https://github.com/xak47d/open-whisper-writer/issues"

[project.scripts]
whisper-writer = "src.main:main"

[project.gui-scripts]
whisper-writer-gui = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["config_schema.yaml"]
"*" = ["assets/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
