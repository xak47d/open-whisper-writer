# Configuration options for the Whisper models
model_options:
  use_api:
    value: false
    type: bool
    description: "Toggle to choose whether to use a cloud API or a local Whisper model for transcription."

  # Common configuration options for both API and local models
  common:
    language:
      value: null
      type: str
      description: "The language code for the transcription in ISO-639-1 format."
    temperature:
      value: 0.0
      type: float
      description: "Controls the randomness of the transcription output. Lower values make the output more focused and deterministic."
    initial_prompt:
      value: null
      type: str
      description: "A string used as an initial prompt to condition the transcription. More info: https://platform.openai.com/docs/guides/speech-to-text/prompting"

  # Configuration options for cloud API providers
  api:
    provider:
      value: openai
      type: str
      description: "The cloud transcription provider to use."
      options:
        - openai
        - groq
        - deepgram
    openai_api_key:
      value: null
      type: str
      description: "Your API key for the OpenAI API."
    openai_model:
      value: gpt-4o-mini-transcribe
      type: str
      description: "The OpenAI model to use for transcription."
      options:
        - whisper-1
        - gpt-4o-transcribe
        - gpt-4o-mini-transcribe
    openai_base_url:
      value: https://api.openai.com/v1
      type: str
      description: "The base URL for the OpenAI-compatible API. Change this to use alternative endpoints."
    groq_api_key:
      value: null
      type: str
      description: "Your API key for the Groq API."
    groq_model:
      value: whisper-large-v3-turbo
      type: str
      description: "The Groq model to use for transcription."
      options:
        - whisper-large-v3
        - whisper-large-v3-turbo
        - distil-whisper-large-v3-en
    deepgram_api_key:
      value: null
      type: str
      description: "Your API key for the Deepgram API."
    deepgram_model:
      value: nova-3
      type: str
      description: "The Deepgram model to use for transcription."
      options:
        - nova-3
        - nova-2

  # Configuration options for the faster-whisper model
  local:
    model:
      value: base
      type: str
      description: "The model to use for transcription. Larger models are more accurate but slower. 'turbo' and 'large-v3-turbo' offer near large-v3 quality at much higher speed. 'distil-*' variants are fast distilled models (English-only for .en)."
      options:
        - tiny
        - tiny.en
        - base
        - base.en
        - small
        - small.en
        - medium
        - medium.en
        - large-v1
        - large-v2
        - large-v3
        - large-v3-turbo
        - turbo
        - distil-small.en
        - distil-medium.en
        - distil-large-v2
        - distil-large-v3
        - distil-large-v3.5
    device:
      value: auto
      type: str
      description: "The device to run the local Whisper model on. Use 'cuda' for NVIDIA GPUs, 'cpu' for CPU-only processing, or 'auto' to let the system automatically choose the best available device."
      options:
        - auto
        - cuda
        - cpu
    compute_type:
      value: default
      type: str
      description: "The compute type to use for the local Whisper model. Use int8/int8_float16 for lower memory usage, float16/bfloat16 for GPU acceleration."
      options:
        - default
        - float32
        - float16
        - bfloat16
        - int8
        - int8_float16
        - int8_bfloat16
    condition_on_previous_text:
      value: true
      type: bool
      description: "Set to true to use the previously transcribed text as a prompt for the next transcription request."
    vad_filter:
      value: false
      type: bool
      description: "Set to true to use a voice activity detection (VAD) filter to remove silence from the recording."
    model_path:
      value: null
      type: str
      description: "The path to the local Whisper model. If not specified, the default model will be downloaded."

# Configuration options for activation and recording
recording_options:
  activation_key:
    value: ctrl+shift+space
    type: str
    description: "The keyboard shortcut to activate the recording and transcribing process. Separate keys with a '+'."
  input_backend:
    value: auto
    type: str
    description: "The input backend to use for detecting key presses. 'auto' will try to use the best available backend."
    options:
      - auto
      - evdev
      - pynput
  recording_mode:
    value: continuous
    type: str
    description: "The recording mode to use. Options include continuous (auto-restart recording after pause in speech until activation key is pressed again), voice_activity_detection (stop recording after pause in speech), press_to_toggle (stop recording when activation key is pressed again), hold_to_record (stop recording when activation key is released)."
    options:
      - continuous
      - voice_activity_detection
      - press_to_toggle
      - hold_to_record
  sound_device:
    value: null
    type: str
    description: "The numeric index of the sound device to use for recording. To find device numbers, run `python -m sounddevice`"
  sample_rate:
    value: 16000
    type: int
    description: "The sample rate in Hz to use for recording."
  silence_duration:
    value: 900
    type: int
    description: "The duration in milliseconds to wait for silence before stopping the recording."
  min_duration:
    value: 100
    type: int
    description: "The minimum duration in milliseconds for a recording to be processed. Recordings shorter than this will be discarded."

# Post-processing options for the transcribed text
post_processing:
  output_mode:
    value: type
    type: str
    description: "How to output the transcribed text. 'type' simulates keyboard input, 'clipboard' copies to clipboard, 'type_and_clipboard' does both."
    options:
      - type
      - clipboard
      - type_and_clipboard
  writing_key_press_delay:
    value: 0.005
    type: float
    description: "The delay in seconds between each key press when writing the transcribed text."
  remove_trailing_period:
    value: false
    type: bool
    description: "Set to true to remove the trailing period from the transcribed text."
  add_trailing_space:
    value: true
    type: bool
    description: "Set to true to add a space to the end of the transcribed text."
  remove_capitalization:
    value: false
    type: bool
    description: "Set to true to convert the transcribed text to lowercase."
  input_method:
    value: pynput
    type: str
    description: "The method to use for simulating keyboard input."
    options:
      - pynput
      - ydotool
      - dotool

# LLM post-processing options
llm_processing:
  enabled:
    value: false
    type: bool
    description: "Enable LLM post-processing to clean up, rewrite, or transform transcribed text."
  provider:
    value: openai
    type: str
    description: "The LLM provider to use for post-processing."
    options:
      - openai
      - anthropic
      - ollama
  model:
    value: gpt-4o-mini
    type: str
    description: "The LLM model to use for post-processing."
  api_key:
    value: null
    type: str
    description: "The API key for the LLM provider. Not needed for Ollama."
  base_url:
    value: null
    type: str
    description: "Custom base URL for the LLM API. Leave empty for default endpoints. For Ollama, defaults to http://localhost:11434."
  mode:
    value: clean_up
    type: str
    description: "The processing mode. 'clean_up' fixes grammar and filler words. 'formal' rewrites in professional tone. 'translate' translates to target language. 'custom' uses your custom prompt."
    options:
      - clean_up
      - formal
      - translate
      - custom
  target_language:
    value: English
    type: str
    description: "The target language for translation mode."
  custom_prompt:
    value: null
    type: str
    description: "Custom system prompt for the LLM. Used when mode is 'custom'."

# Miscellaneous settings
misc:
  print_to_terminal:
    value: true
    type: bool
    description: "Set to true to print the script status and transcribed text to the terminal."
  hide_status_window:
    value: false
    type: bool
    description: "Set to true to hide the animated status bubble during operation."
  noise_on_completion:
    value: false
    type: bool
    description: "Set to true to play a notification sound after the transcription has been typed out."
